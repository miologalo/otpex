<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS OTP & Number Extractor Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS for Excel/CSV parsing and export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Cyberpunk Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { mono: ['"Share Tech Mono"', 'monospace'] },
                    colors: {
                        cyber: { bg: '#090a0f', panel: '#12141d', cyan: '#00ffcc', magenta: '#ff00ff', dark: '#040508' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Share Tech Mono', monospace; background-color: #090a0f; color: #00ffcc; }
        .cyber-panel { background: rgba(18, 20, 29, 0.95); border: 1px solid #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.15); }
        .cyber-input { background: #040508; color: #00ffcc; border: 1px solid #00ffcc; outline: none; }
        .cyber-input:focus { box-shadow: 0 0 8px #00ffcc; }
        .cyber-btn { background: #00ffcc; color: #090a0f; text-transform: uppercase; font-weight: bold; transition: all 0.2s; }
        .cyber-btn:hover { background: #00ccaa; box-shadow: 0 0 12px #00ffcc; }
        .cyber-btn-outline { background: transparent; color: #00ffcc; border: 1px solid #00ffcc; }
        .cyber-btn-outline:hover { background: #00ffcc; color: #090a0f; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #090a0f; }
        ::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff00ff; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col gap-6">

    <!-- Header -->
    <header class="text-center py-4">
        <h1 class="text-3xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyber-cyan to-cyber-magenta tracking-widest drop-shadow-[0_0_10px_rgba(0,255,204,0.8)]">
            SMS OTP & NUMBER EXTRACTOR PRO
        </h1>
        <p class="text-cyber-cyan mt-2 opacity-80">ULTRA-ACCURATE ENGINE // v2.0</p>
    </header>

    <!-- Main Controls -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Input Section -->
        <div class="cyber-panel p-5 rounded-lg flex flex-col gap-4 lg:col-span-2">
            <div class="flex justify-between items-end">
                <h2 class="text-xl font-bold border-b border-cyber-cyan pb-1">DATA INGESTION</h2>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 cursor-pointer text-sm">
                        <input type="checkbox" id="toggle5to6" class="accent-cyber-cyan w-4 h-4">
                        Convert 5-digit to 6-digit (Prepend 0)
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-sm">
                        <input type="checkbox" id="toggleDuplicates" class="accent-cyber-magenta w-4 h-4">
                        Remove Duplicates
                    </label>
                </div>
            </div>
            
            <textarea id="rawInput" rows="6" class="cyber-input w-full p-3 rounded resize-y" placeholder="Paste raw logs... (e.g. +8801700000000 | G-123456 is your Facebook code)"></textarea>
            
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <input type="file" id="fileUpload" accept=".txt,.csv,.xlsx,.xls" class="hidden">
                    <label for="fileUpload" class="cyber-btn-outline px-4 py-2 cursor-pointer rounded w-full text-center">📁 UPLOAD FILE</label>
                    <span id="fileName" class="text-xs opacity-70 truncate max-w-[150px]">No file selected</span>
                </div>
                <button onclick="processData()" class="cyber-btn px-8 py-2 rounded w-full md:w-auto">⚡ EXTRACT & CLASSIFY</button>
            </div>
        </div>

        <!-- Global Actions -->
        <div class="cyber-panel p-5 rounded-lg flex flex-col gap-4">
            <h2 class="text-xl font-bold border-b border-cyber-magenta text-cyber-magenta pb-1">SYSTEM OVERRIDE</h2>
            
            <div class="flex flex-col gap-3 mt-2">
                <button onclick="undoDelete()" class="cyber-btn-outline px-4 py-2 rounded border-cyber-magenta text-cyber-magenta hover:bg-cyber-magenta hover:text-cyber-bg w-full">↩️ UNDO LAST DELETE</button>
                <button onclick="clearAll()" class="cyber-btn-outline px-4 py-2 rounded text-red-500 border-red-500 hover:bg-red-500 hover:text-cyber-bg w-full">🗑️ CLEAR ALL DATA</button>
            </div>

            <h3 class="text-sm font-bold mt-4 mb-2 text-cyber-cyan">GLOBAL EXPORT (ALL)</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="exportExcel()" class="cyber-btn px-2 py-1 text-sm rounded">📊 EXCEL</button>
                <button onclick="exportCSV()" class="cyber-btn px-2 py-1 text-sm rounded">📄 CSV</button>
            </div>
        </div>
    </div>

    <!-- Output Dashboard -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="dashboard"></div>

    <script>
        let globalData = [];
        let historyStack = [];

        const CATEGORIES = {
            FB6: { id: 'FB6', title: 'FACEBOOK (6-DIGIT)', color: 'cyber-cyan' },
            FB5: { id: 'FB5', title: 'FACEBOOK (5-DIGIT)', color: 'blue-400' },
            IG6: { id: 'IG6', title: 'INSTAGRAM (6-DIGIT)', color: 'cyber-magenta' },
            IG5: { id: 'IG5', title: 'INSTAGRAM (5-DIGIT)', color: 'pink-400' },
            OTH6: { id: 'OTH6', title: 'OTHER (6-DIGIT)', color: 'yellow-400' },
            OTH5: { id: 'OTH5', title: 'OTHER (5-DIGIT)', color: 'orange-400' }
        };

        const translationDict = {
            'codigo': 'code', 'código': 'code', 'kód': 'code', 'رمز': 'code', 'kod': 'code', 'kode': 'code'
        };

        // File Upload
        document.getElementById('fileUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('fileName').textContent = file.name;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = evt.target.result;
                if (file.name.endsWith('.txt')) {
                    document.getElementById('rawInput').value += (document.getElementById('rawInput').value ? '\n' : '') + data;
                } else {
                    const workbook = XLSX.read(data, { type: 'binary' });
                    let combinedText = '';
                    workbook.SheetNames.forEach(sheetName => {
                        const xlData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});
                        xlData.forEach(row => { combinedText += row.join(' ') + '\n'; });
                    });
                    document.getElementById('rawInput').value += (document.getElementById('rawInput').value ? '\n' : '') + combinedText;
                }
            };
            if (file.name.endsWith('.txt')) reader.readAsText(file);
            else reader.readAsBinaryString(file);
        });

        // The Engine
        function processData() {
            const rawText = document.getElementById('rawInput').value;
            const lines = rawText.split('\n');
            const convert5to6 = document.getElementById('toggle5to6').checked;
            const removeDupes = document.getElementById('toggleDuplicates').checked;
            
            let newEntries = [];
            const seenSet = new Set(globalData.map(d => `${d.number}-${d.otp}`));

            lines.forEach(line => {
                const originalLine = line.trim();
                if (!originalLine) return;

                let number = 'UNKNOWN';
                let messageText = originalLine;

                // 1. Precise Number Extraction (Handles Format: Number | Message or Number : Message)
                const delimiterMatch = originalLine.match(/^([+\d][\d\s\-()]{7,18})\s*[:|,\t]\s*(.*)$/);
                if (delimiterMatch) {
                    number = delimiterMatch[1].replace(/[\s\-()]/g, '');
                    messageText = delimiterMatch[2];
                } else {
                    // Fallback: Find the first 8+ digit block
                    const phoneMatch = originalLine.match(/(?:^|\s)([+\d][\d\s\-()]{7,18})(?:\s|$|:)/);
                    if (phoneMatch) {
                        number = phoneMatch[1].replace(/[\s\-()]/g, '');
                        messageText = originalLine.replace(phoneMatch[1], ''); // Strip number from msg
                    }
                }
                
                if (number !== 'UNKNOWN') number = number.replace(/[^\d+]/g, '');

                // 2. Language Normalization
                let normalizedText = originalLine.toLowerCase();
                for (const [key, val] of Object.entries(translationDict)) {
                    normalizedText = normalizedText.replace(new RegExp(key, 'g'), val);
                }

                // 3. OTP Extraction Logic
                let otp = null;

                // A. Sanitize false positives (Dates and Times)
                let safeText = messageText
                    .replace(/\d{2,4}[-/.]\d{2}[-/.]\d{2,4}/g, ' [DATE] ')
                    .replace(/\d{2}:\d{2}(:\d{2})?/g, ' [TIME] ');

                // B. Look for explicitly structured OTPs (G-123456, code: 123456, etc.)
                // (?<!\d) ensures we don't grab the end of a longer number sequence
                const explicitMatch = safeText.match(/(?:G-|FB-|IG-|code[\s:=]+|is[\s]+)(?<!\d)(\d{5,6})(?!\d)/i);
                
                if (explicitMatch) {
                    otp = explicitMatch[1];
                } else {
                    // C. Fallback: Find isolated 5 or 6 digit number
                    const fallbackMatch = safeText.match(/(?<!\d)(\d{5,6})(?!\d)/);
                    if (fallbackMatch) {
                        otp = fallbackMatch[1];
                    }
                }

                if (!otp) return; // Skip if absolutely no OTP found

                let originalOtpLength = otp.length;

                // 4. Smart Platform Detection
                let platform = 'OTH';
                if (
                    normalizedText.includes('facebook') || 
                    normalizedText.includes('fb') || 
                    normalizedText.includes('laz+nxcarhw') || 
                    normalizedText.includes('laz+nxcarlw') ||
                    safeText.includes('G-')
                ) {
                    platform = 'FB';
                } else if (normalizedText.includes('instagram') || normalizedText.includes('ig')) {
                    platform = 'IG';
                }

                // 5. 5-to-6 Conversion toggle
                if (originalOtpLength === 5 && convert5to6) {
                    otp = '0' + otp;
                    originalOtpLength = 6;
                }

                const catId = `${platform}${originalOtpLength}`;

                // Duplicate Filter
                const uniqueKey = `${number}-${otp}`;
                if (removeDupes && seenSet.has(uniqueKey)) return;
                seenSet.add(uniqueKey);
                
                newEntries.push({
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                    number: number,
                    otp: otp,
                    originalLine: originalLine,
                    catId: catId
                });
            });

            if (newEntries.length > 0) {
                saveState();
                globalData = [...globalData, ...newEntries];
                renderDashboard();
                document.getElementById('rawInput').value = '';
            } else {
                alert("No valid numbers/OTPs found. Make sure the text format is clear.");
            }
        }

        // Dashboard Rendering
        function renderDashboard() {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';

            Object.values(CATEGORIES).forEach(cat => {
                const items = globalData.filter(d => d.catId === cat.id);
                const card = document.createElement('div');
                card.className = `cyber-panel flex flex-col h-[400px] rounded-lg border-t-4 border-${cat.color} overflow-hidden`;
                
                card.innerHTML = `
                    <div class="p-3 bg-cyber-dark border-b border-${cat.color} flex justify-between items-center">
                        <h3 class="font-bold text-${cat.color} flex items-center gap-2">
                            ${cat.title} 
                            <span class="bg-${cat.color} text-cyber-dark px-2 py-0.5 rounded text-xs">${items.length}</span>
                        </h3>
                    </div>
                    
                    <div class="p-2 grid grid-cols-2 gap-2 border-b border-gray-800 bg-black/40">
                        <select id="exportFormat_${cat.id}" class="cyber-input text-xs p-1">
                            <option value="num_pipe_otp">number|otp</option>
                            <option value="num_space_pipe_otp">number | otp</option>
                            <option value="num_only">number only</option>
                            <option value="otp_only">otp only</option>
                        </select>
                        <button onclick="copyCategory('${cat.id}')" class="cyber-btn text-xs py-1 rounded">📋 COPY</button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-3 space-y-2">
                        ${items.length === 0 ? '<p class="text-xs text-gray-500 text-center mt-4">NO DATA FOUND</p>' : ''}
                        ${items.map(item => `
                            <div class="flex justify-between items-center bg-cyber-dark p-2 rounded border border-gray-800 hover:border-${cat.color} group transition-colors">
                                <div class="flex items-center gap-3 overflow-hidden">
                                    <input type="checkbox" class="cat-check-${cat.id} accent-${cat.color} w-3 h-3" value="${item.id}">
                                    <div class="flex flex-col truncate">
                                        <span class="text-sm font-bold text-white tracking-wider">${item.number}</span>
                                        <span class="text-xs text-${cat.color} font-bold">${item.otp}</span>
                                    </div>
                                </div>
                                <button onclick="deleteItem('${item.id}')" class="text-gray-600 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">✖</button>
                            </div>
                        `).join('')}
                    </div>

                    ${items.length > 0 ? `
                    <div class="p-2 bg-cyber-dark border-t border-gray-800">
                        <button onclick="deleteSelected('${cat.id}')" class="w-full text-xs cyber-btn-outline py-1 border-red-500 text-red-500 hover:bg-red-500 hover:text-white rounded">DELETE SELECTED</button>
                    </div>
                    ` : ''}
                `;
                dashboard.appendChild(card);
            });
        }

        // Data Management
        function saveState() {
            historyStack.push(JSON.stringify(globalData));
            if(historyStack.length > 10) historyStack.shift();
        }

        function undoDelete() {
            if (historyStack.length > 0) {
                globalData = JSON.parse(historyStack.pop());
                renderDashboard();
            } else { alert("Nothing to undo!"); }
        }

        function clearAll() {
            if(confirm("Clear all extracted data?")) {
                saveState();
                globalData = [];
                renderDashboard();
            }
        }

        function deleteItem(id) {
            saveState();
            globalData = globalData.filter(d => d.id !== id);
            renderDashboard();
        }

        function deleteSelected(catId) {
            const checkboxes = document.querySelectorAll(`.cat-check-${catId}:checked`);
            if (checkboxes.length === 0) return;
            saveState();
            const idsToDelete = Array.from(checkboxes).map(cb => cb.value);
            globalData = globalData.filter(d => !idsToDelete.includes(d.id));
            renderDashboard();
        }

        // Export Tools
        function copyCategory(catId) {
            const items = globalData.filter(d => d.catId === catId);
            if (items.length === 0) return alert("No data to copy.");
            
            const format = document.getElementById(`exportFormat_${catId}`).value;
            const textToCopy = items.map(item => {
                if(format === 'num_pipe_otp') return `${item.number}|${item.otp}`;
                if(format === 'num_space_pipe_otp') return `${item.number} | ${item.otp}`;
                if(format === 'num_only') return `${item.number}`;
                return `${item.otp}`;
            }).join('\n');
            
            navigator.clipboard.writeText(textToCopy).then(() => alert(`Copied ${items.length} items!`));
        }

        function exportExcel() {
            if (globalData.length === 0) return alert("No data to export!");
            const wb = XLSX.utils.book_new();
            Object.values(CATEGORIES).forEach(cat => {
                const items = globalData.filter(d => d.catId === cat.id);
                if (items.length > 0) {
                    const wsData = items.map(item => ({
                        'Phone Number': item.number, 'OTP Code': item.otp, 'Original Text': item.originalLine
                    }));
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(wsData), cat.title.replace(/[^a-zA-Z0-9 -]/g, "").substring(0, 31));
                }
            });
            XLSX.writeFile(wb, "SMS_Extracted_Data.xlsx");
        }

        function exportCSV() {
            if (globalData.length === 0) return alert("No data to export!");
            const wsData = globalData.map(item => ({
                'Category': CATEGORIES[item.catId].title, 'Phone Number': item.number, 'OTP Code': item.otp, 'Original Text': item.originalLine
            }));
            const csv = XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(wsData));
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "SMS_Extracted_Data.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        renderDashboard();
    </script>
</body>
</html>
